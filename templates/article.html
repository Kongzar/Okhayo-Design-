{% extends "layout.html" %}

{% block content %}

<article style="margin-top:60px">

  <!-- Hero image -->
  {% if article.image_url %}
    <div style="height:70vh;overflow:hidden;position:relative">
      <img src="{{ article.image_url }}"
           alt="{{ article.title }}"
           style="width:100%;height:100%;object-fit:cover">
      <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(35,18,9,.7) 0%,transparent 60%)"></div>
    </div>
  {% else %}
    <div style="height:40vh;background:var(--soil);position:relative">
      <div class="ndiv" style="position:absolute;bottom:0;left:0;right:0"></div>
    </div>
  {% endif %}

  <!-- Article content -->
  <div style="max-width:760px;margin:0 auto;padding:80px 40px">

    <!-- Category -->
    <p class="s-label" style="margin-bottom:20px">{{ article.category }}</p>

    <!-- Title -->
    <h1 style="font-family:var(--fd);font-size:clamp(40px,5vw,68px);font-weight:300;color:var(--soil);line-height:1.05;margin-bottom:24px">
      {{ article.title }}
    </h1>

    <!-- Meta -->
    <div style="display:flex;align-items:center;gap:24px;margin-bottom:56px;padding-bottom:32px;border-bottom:1px solid var(--mist)">
      <p style="font-size:12px;color:var(--ash);letter-spacing:.1em">
        By {{ article.author }}
      </p>
      <p style="font-size:12px;color:var(--ash)">
        {{ article.created_at[:10] }}
      </p>
    </div>

    <!-- Excerpt -->
    <p style="font-family:var(--fd);font-size:22px;font-style:italic;color:var(--terra);line-height:1.6;margin-bottom:48px;border-left:2px solid var(--clay);padding-left:24px">
      {{ article.excerpt }}
    </p>

    <!-- Body -->
    <div style="font-size:15px;color:var(--bark);line-height:2;font-weight:300"
         class="article-body">
      {{ article.body | safe }}
    </div>

    <!-- Back link -->
    <div style="margin-top:80px;padding-top:40px;border-top:1px solid var(--mist)">
      <a href="/journal"
         style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);text-decoration:none">
        ← Back to Journal
      </a>
    </div>

  </div>

</article>

{% endblock %}
